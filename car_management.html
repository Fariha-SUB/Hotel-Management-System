<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Management - Lodify</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-container">
    <div class="page-header">
        <h1><i class="fas fa-car"></i> Car Management</h1>
        <button class="btn-primary" onclick="showAddCar()"><i class="fas fa-plus"></i> Add Car</button>
    </div>

    <!-- Statistics Cards -->
    <div class="stats-mini">
        <div class="stat-mini-card">
            <i class="fas fa-car" style="color: #3498db"></i>
            <div class="stat-number" id="totalCars">0</div>
            <div class="stat-label">Total Cars</div>
        </div>
        <div class="stat-mini-card">
            <i class="fas fa-check-circle" style="color: #2ecc71"></i>
            <div class="stat-number" id="availableCars">0</div>
            <div class="stat-label">Available</div>
        </div>
        <div class="stat-mini-card">
            <i class="fas fa-clock" style="color: #f39c12"></i>
            <div class="stat-number" id="rentedCars">0</div>
            <div class="stat-label">Rented</div>
        </div>
    </div>

    <!-- Cars Grid -->
    <div class="card">
        <h3><i class="fas fa-taxi"></i> Our Fleet</h3>
        <div id="carsGrid" class="cars-grid"></div>
    </div>
</div>

<!-- Add/Edit Car Modal -->
<div id="carModal" class="modal" style="display:none">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Add New Car</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <input type="hidden" id="carId">
            <div class="form-group">
                <label>Car Name / Model</label>
                <input type="text" id="carName" class="form-control" placeholder="e.g., Toyota Camry">
            </div>
            <div class="form-group">
                <label>License Plate</label>
                <input type="text" id="licensePlate" class="form-control" placeholder="e.g., DHAKA-1234">
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="carStatus" class="form-control">
                    <option value="available">Available</option>
                    <option value="rented">Rented</option>
                    <option value="maintenance">Maintenance</option>
                </select>
            </div>
            <div class="form-group">
                <label>Price per Day ($)</label>
                <input type="number" id="carPrice" class="form-control" placeholder="e.g., 50">
            </div>
            <div class="form-group">
                <label>Seating Capacity</label>
                <input type="number" id="carSeats" class="form-control" placeholder="e.g., 4">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn-primary" onclick="saveCar()">Save Car</button>
        </div>
    </div>
</div>

<script>
let cars = [];

function loadCars() {
    const saved = localStorage.getItem('hotel_cars');
    if(saved) {
        cars = JSON.parse(saved);
    } else {
        cars = [
            { id: 1, name: 'Toyota Camry', license: 'DHAKA-1001', status: 'available', price: 50, seats: 4 },
            { id: 2, name: 'Honda Civic', license: 'DHAKA-1002', status: 'rented', price: 45, seats: 4 },
            { id: 3, name: 'Mitsubishi Pajero', license: 'DHAKA-1003', status: 'available', price: 80, seats: 7 },
            { id: 4, name: 'Nissan Sunny', license: 'DHAKA-1004', status: 'maintenance', price: 35, seats: 4 }
        ];
        localStorage.setItem('hotel_cars', JSON.stringify(cars));
    }
    displayCars();
    updateStats();
}

function displayCars() {
    const container = document.getElementById('carsGrid');
    if(cars.length === 0) {
        container.innerHTML = '<div class="empty-state">No cars available</div>';
        return;
    }
    
    container.innerHTML = cars.map(car => `
        <div class="car-card ${car.status}">
            <div class="car-icon"><i class="fas fa-car"></i></div>
            <div class="car-info">
                <div class="car-name">${car.name}</div>
                <div class="car-license">${car.license}</div>
                <div class="car-details">
                    <span><i class="fas fa-users"></i> ${car.seats} seats</span>
                    <span><i class="fas fa-dollar-sign"></i> ${car.price}/day</span>
                </div>
                <div class="car-status status-${car.status}">${car.status.toUpperCase()}</div>
            </div>
            <div class="car-actions">
                <button class="edit-btn" onclick="editCar(${car.id})"><i class="fas fa-edit"></i></button>
                <button class="delete-btn" onclick="deleteCar(${car.id})"><i class="fas fa-trash"></i></button>
            </div>
        </div>
    `).join('');
}

function updateStats() {
    document.getElementById('totalCars').innerText = cars.length;
    document.getElementById('availableCars').innerText = cars.filter(c => c.status === 'available').length;
    document.getElementById('rentedCars').innerText = cars.filter(c => c.status === 'rented').length;
}

function showAddCar() {
    document.getElementById('modalTitle').innerText = 'Add New Car';
    document.getElementById('carId').value = '';
    document.getElementById('carName').value = '';
    document.getElementById('licensePlate').value = '';
    document.getElementById('carStatus').value = 'available';
    document.getElementById('carPrice').value = '';
    document.getElementById('carSeats').value = '';
    document.getElementById('carModal').style.display = 'block';
}

function editCar(id) {
    const car = cars.find(c => c.id === id);
    document.getElementById('modalTitle').innerText = 'Edit Car';
    document.getElementById('carId').value = car.id;
    document.getElementById('carName').value = car.name;
    document.getElementById('licensePlate').value = car.license;
    document.getElementById('carStatus').value = car.status;
    document.getElementById('carPrice').value = car.price;
    document.getElementById('carSeats').value = car.seats;
    document.getElementById('carModal').style.display = 'block';
}

function saveCar() {
    const id = document.getElementById('carId').value;
    const carData = {
        name: document.getElementById('carName').value,
        license: document.getElementById('licensePlate').value,
        status: document.getElementById('carStatus').value,
        price: parseInt(document.getElementById('carPrice').value),
        seats: parseInt(document.getElementById('carSeats').value)
    };
    
    if(id) {
        const index = cars.findIndex(c => c.id == id);
        cars[index] = { ...cars[index], ...carData };
    } else {
        carData.id = Date.now();
        cars.push(carData);
    }
    
    localStorage.setItem('hotel_cars', JSON.stringify(cars));
    closeModal();
    displayCars();
    updateStats();
}

function deleteCar(id) {
    if(confirm('Delete this car?')) {
        cars = cars.filter(c => c.id !== id);
        localStorage.setItem('hotel_cars', JSON.stringify(cars));
        displayCars();
        updateStats();
    }
}

function closeModal() {
    document.getElementById('carModal').style.display = 'none';
}

loadCars();
</script>

</body>
</html>
