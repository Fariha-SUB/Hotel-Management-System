<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check In</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="page-container">
    <div class="page-header">
        <h1><i class="fas fa-sign-in-alt"></i> Check In</h1>
    </div>

    <!-- Quick Check-in Form -->
    <div class="card">
        <h3><i class="fas fa-plus-circle"></i> Quick Check-In</h3>
        <form onsubmit="quickCheckin(event)">
            <div class="form-row">
                <div class="form-group">
                    <label>Guest Name</label>
                    <input type="text" id="guestName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Select Room</label>
                    <select id="roomSelect" class="form-control" required>
                        <option value="">-- Select a room --</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Check-in Date</label>
                    <input type="date" id="checkinDate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Check-out Date</label>
                    <input type="date" id="checkoutDate" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn-primary">Confirm Check-In</button>
        </form>
    </div>

    <!-- Today's Check-ins List -->
    <div class="card">
        <h3><i class="fas fa-calendar-check"></i> Today's Check-ins</h3>
        <div id="todayCheckinsList" class="checkins-list"></div>
    </div>
</div>

<style>
.page-container { padding: 20px; max-width: 800px; margin: 0 auto; }
.card { background: white; border-radius: 20px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #1e2a3e; }
.form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 14px; }
.btn-primary { background: #f5a623; color: white; padding: 12px 28px; border: none; border-radius: 30px; cursor: pointer; font-weight: 600; }
.checkins-list { max-height: 400px; overflow-y: auto; }
.checkin-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; margin-bottom: 10px; background: #f8f9fa; border-radius: 12px; border-left: 4px solid #f5a623; }
.checkin-time { background: #f5a623; color: white; padding: 5px 15px; border-radius: 20px; font-size: 12px; }
</style>

<script>
// ডিফল্ট রুম ডাটা তৈরি করুন (যদি localStorage এ না থাকে)
function initRooms() {
    let rooms = localStorage.getItem('hotel_rooms');
    if (!rooms) {
        const defaultRooms = [
            { id: 1, number: '101', type: 'Standard', status: 'available', price: 120 },
            { id: 2, number: '102', type: 'Standard', status: 'available', price: 120 },
            { id: 3, number: '201', type: 'Deluxe', status: 'available', price: 180 },
            { id: 4, number: '202', type: 'Executive', status: 'available', price: 250 },
            { id: 5, number: '301', type: 'Suite', status: 'available', price: 350 }
        ];
        localStorage.setItem('hotel_rooms', JSON.stringify(defaultRooms));
    }
}

// উপলব্ধ রুম লোড করুন
function loadAvailableRooms() {
    const rooms = JSON.parse(localStorage.getItem('hotel_rooms')) || [];
    const availableRooms = rooms.filter(room => room.status === 'available');
    const select = document.getElementById('roomSelect');
    
    if (availableRooms.length === 0) {
        select.innerHTML = '<option value="">-- No rooms available --</option>';
        return;
    }
    
    select.innerHTML = '<option value="">-- Select a room --</option>' + 
        availableRooms.map(room => `<option value="${room.id}">Room ${room.number} - ${room.type} ($${room.price}/night)</option>`).join('');
}

// চেকইন সেভ করুন
function saveCheckin(checkinData) {
    let checkins = JSON.parse(localStorage.getItem('hotel_checkins')) || [];
    checkins.push(checkinData);
    localStorage.setItem('hotel_checkins', JSON.stringify(checkins));
}

// আজকের চেকইন দেখান
function displayTodayCheckins() {
    const checkins = JSON.parse(localStorage.getItem('hotel_checkins')) || [];
    const today = new Date().toISOString().split('T')[0];
    const todayCheckins = checkins.filter(c => c.checkinDate === today);
    const container = document.getElementById('todayCheckinsList');
    
    if (todayCheckins.length === 0) {
        container.innerHTML = '<div class="empty-state">No check-ins scheduled for today</div>';
        return;
    }
    
    container.innerHTML = todayCheckins.map(c => `
        <div class="checkin-item">
            <div>
                <strong>${c.guestName}</strong><br>
                <small>Room ${c.roomNumber}</small>
            </div>
            <div class="checkin-time">${c.time || '12:00'}</div>
        </div>
    `).join('');
}

// কোয়িক চেকইন ফাংশন
function quickCheckin(event) {
    event.preventDefault();
    
    const roomId = document.getElementById('roomSelect').value;
    if (!roomId) {
        alert('Please select a room');
        return;
    }
    
    const rooms = JSON.parse(localStorage.getItem('hotel_rooms'));
    const selectedRoom = rooms.find(r => r.id == roomId);
    
    const newCheckin = {
        id: Date.now(),
        guestName: document.getElementById('guestName').value,
        roomNumber: selectedRoom.number,
        roomId: selectedRoom.id,
        checkinDate: document.getElementById('checkinDate').value,
        checkoutDate: document.getElementById('checkoutDate').value,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    };
    
    // চেকইন সেভ করুন
    saveCheckin(newCheckin);
    
    // রুম স্ট্যাটাস আপডেট করুন
    const roomIndex = rooms.findIndex(r => r.id == roomId);
    if (roomIndex !== -1) {
        rooms[roomIndex].status = 'occupied';
        localStorage.setItem('hotel_rooms', JSON.stringify(rooms));
    }
    
    alert(`Check-in successful for ${newCheckin.guestName} in Room ${newCheckin.roomNumber}`);
    
    // ফর্ম রিসেট করুন
    document.getElementById('guestName').value = '';
    document.getElementById('roomSelect').value = '';
    document.getElementById('checkoutDate').value = '';
    
    // রিফ্রেশ করুন
    loadAvailableRooms();
    displayTodayCheckins();
}

// পেজ লোড হলে রান করুন
initRooms();
loadAvailableRooms();
displayTodayCheckins();
document.getElementById('checkinDate').value = new Date().toISOString().split('T')[0];
</script>

</body>
</html>
