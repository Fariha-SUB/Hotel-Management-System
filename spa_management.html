<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spa Management - Lodify</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-container">
    <div class="page-header">
        <h1><i class="fas fa-spa"></i> Spa Management</h1>
        <button class="btn-primary" onclick="showAddBooking()"><i class="fas fa-plus"></i> New Booking</button>
    </div>

    <!-- Statistics Cards -->
    <div class="stats-mini">
        <div class="stat-mini-card">
            <i class="fas fa-calendar-check" style="color: #3498db"></i>
            <div class="stat-number" id="todayBookings">0</div>
            <div class="stat-label">Today's Bookings</div>
        </div>
        <div class="stat-mini-card">
            <i class="fas fa-clock" style="color: #f5a623"></i>
            <div class="stat-number" id="pendingBookings">0</div>
            <div class="stat-label">Pending</div>
        </div>
        <div class="stat-mini-card">
            <i class="fas fa-check-circle" style="color: #2ecc71"></i>
            <div class="stat-number" id="completedBookings">0</div>
            <div class="stat-label">Completed</div>
        </div>
    </div>

    <!-- Spa Services -->
    <div class="card">
        <h3><i class="fas fa-list-ul"></i> Spa Services</h3>
        <div class="services-grid" id="servicesGrid"></div>
    </div>

    <!-- Bookings List -->
    <div class="card">
        <h3><i class="fas fa-calendar-alt"></i> Spa Bookings</h3>
        <div id="bookingsList" class="bookings-list"></div>
    </div>
</div>

<!-- Add Booking Modal -->
<div id="bookingModal" class="modal" style="display:none">
    <div class="modal-content">
        <div class="modal-header">
            <h3>New Spa Booking</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Guest Name</label>
                <input type="text" id="guestName" class="form-control">
            </div>
            <div class="form-group">
                <label>Room Number</label>
                <input type="text" id="roomNumber" class="form-control">
            </div>
            <div class="form-group">
                <label>Select Service</label>
                <select id="serviceSelect" class="form-control">
                    <option value="Swedish Massage">Swedish Massage - $60</option>
                    <option value="Deep Tissue Massage">Deep Tissue Massage - $80</option>
                    <option value="Aromatherapy">Aromatherapy - $70</option>
                    <option value="Facial Treatment">Facial Treatment - $50</option>
                    <option value="Body Scrub">Body Scrub - $55</option>
                </select>
            </div>
            <div class="form-group">
                <label>Date & Time</label>
                <input type="datetime-local" id="bookingTime" class="form-control">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn-primary" onclick="saveBooking()">Confirm Booking</button>
        </div>
    </div>
</div>

<script>
let spaBookings = [];

const services = [
    { name: 'Swedish Massage', price: 60, duration: '60 min', icon: 'fas fa-hand-holding-heart' },
    { name: 'Deep Tissue Massage', price: 80, duration: '60 min', icon: 'fas fa-hand-sparkles' },
    { name: 'Aromatherapy', price: 70, duration: '45 min', icon: 'fas fa-leaf' },
    { name: 'Facial Treatment', price: 50, duration: '45 min', icon: 'fas fa-face-smile' },
    { name: 'Body Scrub', price: 55, duration: '30 min', icon: 'fas fa-water' }
];

function loadServices() {
    const container = document.getElementById('servicesGrid');
    container.innerHTML = services.map(service => `
        <div class="service-card">
            <i class="${service.icon}"></i>
            <div class="service-name">${service.name}</div>
            <div class="service-price">$${service.price}</div>
            <div class="service-duration">${service.duration}</div>
        </div>
    `).join('');
}

function loadBookings() {
    const saved = localStorage.getItem('spa_bookings');
    if(saved) {
        spaBookings = JSON.parse(saved);
    } else {
        spaBookings = [
            { id: 1, guestName: 'Sophia Martin', roomNumber: '205', service: 'Swedish Massage', time: '2026-05-02T10:00', status: 'confirmed' },
            { id: 2, guestName: 'Liam Johnson', roomNumber: '312', service: 'Deep Tissue Massage', time: '2026-05-02T14:00', status: 'pending' }
        ];
        localStorage.setItem('spa_bookings', JSON.stringify(spaBookings));
    }
    displayBookings();
    updateStats();
}

function displayBookings() {
    const container = document.getElementById('bookingsList');
    if(spaBookings.length === 0) {
        container.innerHTML = '<div class="empty-state">No spa bookings</div>';
        return;
    }
    
    container.innerHTML = spaBookings.map(b => `
        <div class="booking-card">
            <div class="booking-header">
                <strong>${b.guestName}</strong>
                <span class="booking-status ${b.status}">${b.status}</span>
            </div>
            <div class="booking-details">
                <span><i class="fas fa-door-open"></i> Room ${b.roomNumber}</span>
                <span><i class="fas fa-spa"></i> ${b.service}</span>
                <span><i class="fas fa-clock"></i> ${new Date(b.time).toLocaleString()}</span>
            </div>
            <div class="booking-actions">
                <button class="complete-btn" onclick="completeBooking(${b.id})">Complete</button>
                <button class="cancel-btn" onclick="cancelBooking(${b.id})">Cancel</button>
            </div>
        </div>
    `).join('');
}

function updateStats() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('todayBookings').innerText = spaBookings.filter(b => b.time.startsWith(today)).length;
    document.getElementById('pendingBookings').innerText = spaBookings.filter(b => b.status === 'pending').length;
    document.getElementById('completedBookings').innerText = spaBookings.filter(b => b.status === 'completed').length;
}

function showAddBooking() {
    document.getElementById('guestName').value = '';
    document.getElementById('roomNumber').value = '';
    document.getElementById('serviceSelect').value = 'Swedish Massage';
    document.getElementById('bookingTime').value = '';
    document.getElementById('bookingModal').style.display = 'block';
}

function saveBooking() {
    const newBooking = {
        id: Date.now(),
        guestName: document.getElementById('guestName').value,
        roomNumber: document.getElementById('roomNumber').value,
        service: document.getElementById('serviceSelect').options[document.getElementById('serviceSelect').selectedIndex].text.split(' - ')[0],
        time: document.getElementById('bookingTime').value,
        status: 'pending'
    };
    
    if(!newBooking.guestName || !newBooking.roomNumber || !newBooking.time) {
        alert('Please fill all fields');
        return;
    }
    
    spaBookings.push(newBooking);
    localStorage.setItem('spa_bookings', JSON.stringify(spaBookings));
    closeModal();
    displayBookings();
    updateStats();
    alert('Spa booking confirmed!');
}

function completeBooking(id) {
    const index = spaBookings.findIndex(b => b.id === id);
    if(index !== -1) {
        spaBookings[index].status = 'completed';
        localStorage.setItem('spa_bookings', JSON.stringify(spaBookings));
        displayBookings();
        updateStats();
    }
}

function cancelBooking(id) {
    if(confirm('Cancel this booking?')) {
        spaBookings = spaBookings.filter(b => b.id !== id);
        localStorage.setItem('spa_bookings', JSON.stringify(spaBookings));
        displayBookings();
        updateStats();
    }
}

function closeModal() {
    document.getElementById('bookingModal').style.display = 'none';
}

loadServices();
loadBookings();
</script>

</body>
</html>
