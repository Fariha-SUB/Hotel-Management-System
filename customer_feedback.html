<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback - Lodify</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-container">
    <div class="page-header">
        <h1><i class="fas fa-star"></i> Customer Feedback</h1>
        <button class="btn-primary" onclick="showAddFeedback()"><i class="fas fa-plus"></i> Add Feedback</button>
    </div>

    <!-- Statistics Cards -->
    <div class="stats-mini">
        <div class="stat-mini-card">
            <i class="fas fa-smile" style="color: #2ecc71"></i>
            <div class="stat-number" id="totalFeedbacks">0</div>
            <div class="stat-label">Total Feedbacks</div>
        </div>
        <div class="stat-mini-card">
            <i class="fas fa-star" style="color: #f5a623"></i>
            <div class="stat-number" id="avgRating">0</div>
            <div class="stat-label">Average Rating</div>
        </div>
        <div class="stat-mini-card">
            <i class="fas fa-thumbs-up" style="color: #27ae60"></i>
            <div class="stat-number" id="positiveCount">0</div>
            <div class="stat-label">Positive (4-5⭐)</div>
        </div>
    </div>

    <!-- Feedback List -->
    <div class="card">
        <h3><i class="fas fa-comments"></i> All Feedbacks</h3>
        <div id="feedbackList" class="feedback-list"></div>
    </div>
</div>

<!-- Add Feedback Modal -->
<div id="feedbackModal" class="modal" style="display:none">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Add Customer Feedback</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Guest Name</label>
                <input type="text" id="guestName" class="form-control" placeholder="Enter guest name">
            </div>
            <div class="form-group">
                <label>Room Number</label>
                <input type="text" id="roomNumber" class="form-control" placeholder="Enter room number">
            </div>
            <div class="form-group">
                <label>Rating</label>
                <div class="rating-stars">
                    <i class="far fa-star" data-rating="1" onclick="setRating(1)"></i>
                    <i class="far fa-star" data-rating="2" onclick="setRating(2)"></i>
                    <i class="far fa-star" data-rating="3" onclick="setRating(3)"></i>
                    <i class="far fa-star" data-rating="4" onclick="setRating(4)"></i>
                    <i class="far fa-star" data-rating="5" onclick="setRating(5)"></i>
                </div>
                <input type="hidden" id="ratingValue" value="0">
            </div>
            <div class="form-group">
                <label>Feedback Message</label>
                <textarea id="feedbackMsg" class="form-control" rows="3" placeholder="Write your feedback..."></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn-primary" onclick="saveFeedback()">Submit Feedback</button>
        </div>
    </div>
</div>

<script>
let feedbacks = [];

function loadFeedbacks() {
    const saved = localStorage.getItem('hotel_feedbacks');
    if(saved) {
        feedbacks = JSON.parse(saved);
    } else {
        feedbacks = [
            { id: 1, guestName: 'Sophia Martin', roomNumber: '205', rating: 5, message: 'Excellent service! Very clean rooms.', date: '2026-04-28' },
            { id: 2, guestName: 'Liam Johnson', roomNumber: '312', rating: 4, message: 'Good experience, will come again.', date: '2026-04-27' },
            { id: 3, guestName: 'Emily Clark', roomNumber: '101', rating: 5, message: 'Amazing hotel! Great staff.', date: '2026-04-26' }
        ];
        localStorage.setItem('hotel_feedbacks', JSON.stringify(feedbacks));
    }
    displayFeedbacks();
    updateStats();
}

function displayFeedbacks() {
    const container = document.getElementById('feedbackList');
    if(feedbacks.length === 0) {
        container.innerHTML = '<div class="empty-state">No feedbacks yet</div>';
        return;
    }
    
    container.innerHTML = feedbacks.map(f => `
        <div class="feedback-card">
            <div class="feedback-header">
                <div>
                    <strong>${f.guestName}</strong>
                    <span class="room-badge">Room ${f.roomNumber}</span>
                </div>
                <div class="rating-display">
                    ${getStarRating(f.rating)}
                    <span class="rating-number">${f.rating}.0</span>
                </div>
            </div>
            <div class="feedback-message">"${f.message}"</div>
            <div class="feedback-footer">
                <span><i class="far fa-calendar-alt"></i> ${f.date}</span>
                <button class="delete-feedback" onclick="deleteFeedback(${f.id})"><i class="fas fa-trash"></i></button>
            </div>
        </div>
    `).join('');
}

function getStarRating(rating) {
    let stars = '';
    for(let i = 1; i <= 5; i++) {
        if(i <= rating) {
            stars += '<i class="fas fa-star" style="color:#f5a623"></i>';
        } else {
            stars += '<i class="far fa-star" style="color:#ddd"></i>';
        }
    }
    return stars;
}

function updateStats() {
    document.getElementById('totalFeedbacks').innerText = feedbacks.length;
    const avg = feedbacks.reduce((sum, f) => sum + f.rating, 0) / feedbacks.length;
    document.getElementById('avgRating').innerText = avg.toFixed(1);
    const positive = feedbacks.filter(f => f.rating >= 4).length;
    document.getElementById('positiveCount').innerText = positive;
}

let currentRating = 0;
function setRating(rating) {
    currentRating = rating;
    document.getElementById('ratingValue').value = rating;
    const stars = document.querySelectorAll('.rating-stars i');
    stars.forEach((star, index) => {
        if(index < rating) {
            star.className = 'fas fa-star';
            star.style.color = '#f5a623';
        } else {
            star.className = 'far fa-star';
            star.style.color = '#ddd';
        }
    });
}

function showAddFeedback() {
    document.getElementById('guestName').value = '';
    document.getElementById('roomNumber').value = '';
    document.getElementById('feedbackMsg').value = '';
    currentRating = 0;
    setRating(0);
    document.getElementById('feedbackModal').style.display = 'block';
}

function saveFeedback() {
    const newFeedback = {
        id: Date.now(),
        guestName: document.getElementById('guestName').value,
        roomNumber: document.getElementById('roomNumber').value,
        rating: parseInt(document.getElementById('ratingValue').value),
        message: document.getElementById('feedbackMsg').value,
        date: new Date().toISOString().split('T')[0]
    };
    
    if(!newFeedback.guestName || !newFeedback.roomNumber || newFeedback.rating === 0) {
        alert('Please fill all fields');
        return;
    }
    
    feedbacks.unshift(newFeedback);
    localStorage.setItem('hotel_feedbacks', JSON.stringify(feedbacks));
    closeModal();
    displayFeedbacks();
    updateStats();
    alert('Feedback submitted successfully!');
}

function deleteFeedback(id) {
    if(confirm('Delete this feedback?')) {
        feedbacks = feedbacks.filter(f => f.id !== id);
        localStorage.setItem('hotel_feedbacks', JSON.stringify(feedbacks));
        displayFeedbacks();
        updateStats();
    }
}

function closeModal() {
    document.getElementById('feedbackModal').style.display = 'none';
}

loadFeedbacks();
</script>

</body>
</html>
